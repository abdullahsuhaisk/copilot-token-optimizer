name: Release

# Publishes the extension to the VS Code Marketplace when a version tag such as
# v0.0.11 is pushed. It uses Marketplace Trusted Publishing (OIDC), so no token
# is stored in GitHub.
#
# One-time setup at https://marketplace.visualstudio.com/manage
#   publisher "abdullahsuhaisik" -> Trusted Publishing -> Create
#     Repository owner: abdullahsuhaisk
#     Repository:       copilot-token-optimizer
#     Workflow:         release.yml   (renaming this file breaks the policy)
#     Environment:      leave empty
# The repository is private: push the first tag within 48 hours of creating the
# policy, and that first successful run activates it permanently.
#
# To release: update CHANGELOG.md and commit it, then run
#   npm version patch && git push --follow-tags

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - run: npm test

      # --oidc exists in vsce 4.x (3.9.2 lacks it), which needs Node 22; the version is pinned.
      - run: npx --yes @vscode/vsce@4.1.1 publish --oidc
